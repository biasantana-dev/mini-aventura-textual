<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Aventura Textual</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main>
        <header>
            <h1>Protocolo Nexus</h1>
        </header>
        <div class="container">
            <h2 id="titulo">Saguão da Corporação Nexus</h2>
            <img id="cenario" src="" alt="">

            <div id="paragrafo-container">
                <p id="narrativa"></p>
            </div>

            <div id="box-botoes">
                <button id="btn1" class="btn-escolhas">
                    <span class="destaque-btn"><strong>ESCOLHA A:</strong></span>
                    <span id="escolha-1" class="paragrafo-btn"></span>
                </button>

                <button id="btn2" class="btn-escolhas">
                    <span class="destaque-btn"><strong>ESCOLHA B:</strong></span>
                    <span id="escolha-2" class="paragrafo-btn"></span>
                </button>
            </div>

            <div id="box-reiniciar">
                <button id="btn-reiniciar" class="btn-escolhas btn-azul">
                    <span class="destaque-btn"><strong>RECOMEÇAR MISSÃO</strong></span>
                </button>
            </div>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>

</html>
