<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Aventura Textual</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main>
        <header>
            <h1>Protocolo Nexus</h1>
        </header>
        <div class="container">
            <h2 id="titulo">Saguão da Corporação Nexus</h2>
            <img id="cenario" src="img/saguão.jpg" alt="">

            <div id="paragrafo-container">
                <p id="narrativa">
                    Os alarmes da corporação Nexus estão soando.
                    Você está no saguão principal com o pendrive no bolso.
                    Os guardas estão bloqueando a saída principal.
                </p>
            </div>

            <div id="box-botoes">
                <button id="btn1" class="btn-escolhas">
                    <span class="destaque-btn"><strong>ESCOLHA A:</strong></span>
                    <span class="paragrafo-btn">Fugir pelos becos escuros do subsolo.</span>
                </button>

                <button id="btn2" class="btn-escolhas">
                    <span class="destaque-btn"><strong>ESCOLHA B:</strong></span>
                    <span class="paragrafo-btn">Subir pelo elevador de serviço em direção aos telhados.</span>
                </button>
            </div>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>

</html>
